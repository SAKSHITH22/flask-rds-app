apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: sakshith123/flask-rds-app:v1   # 👈 Your Docker Hub image
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "sakshith-mysql.cu9gmuueigg2.us-east-1.rds.amazonaws.com"
        - name: DB_USER
          value: "flaskuser"
        - name: DB_PASS
          value: "StrongPass123!"
        - name: DB_NAME
          value: "userdb"
